<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#fff;--ink:#111;--muted:#6b6b6b;--line:#ececec;--red:#d0021b;--pos:#e58a93;color-scheme:light;box-sizing:border-box;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:34px 22px 48px}
button{font:inherit;color:inherit;cursor:pointer}
h1{border-top:4px solid var(--red);padding-top:22px;font:700 30px/1.15 Georgia,"Times New Roman",serif;margin:0 0 8px}
h2{font:400 22px/1.2 Georgia,serif;margin:30px 0 12px}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px;max-width:62ch}
svg{display:block;width:100%;height:auto}
.tabs{display:flex;border-bottom:1px solid #ccc;margin:6px 0 18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:4px solid transparent;padding:10px 14px;font-weight:700;font-size:15px;margin-bottom:-1px;white-space:nowrap}
.tab[aria-pressed=true]{border-bottom-color:var(--red)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:14px;align-items:center}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp small{font-size:12px;color:var(--muted);margin-right:2px}
.pill{background:#fff;border:1px solid var(--ink);border-radius:999px;padding:4px 13px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed=true]{background:var(--ink);color:#fff}
.pill i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #fff}
.pill[aria-pressed=false] i{opacity:.35}
.note{font-size:13px;color:var(--muted);margin:14px 0 0;max-width:64ch}
.hero{display:grid;grid-template-columns:minmax(220px,330px) 1fr;gap:24px;align-items:center}
.big{font:400 52px/1 Georgia,serif;margin:4px 0}.big small{font-size:24px}
.nd{transform-origin:150px 150px;transition:transform 1.5s cubic-bezier(.3,1.45,.5,1)}
.arc{fill:none;stroke-width:16}
.gl{font-size:11px;fill:var(--muted)}
.pv{font-size:13px;color:var(--muted)}.pv b{color:var(--ink)}
.card{border-left:4px solid var(--red);background:#f8f8f8;padding:12px 16px;margin-bottom:14px;min-height:96px}
.card .n{font-size:14px;font-weight:700}.card b{display:inline-block;font:400 26px/1.2 Georgia,serif;margin:2px 14px 0 0}.card span{font-size:13px;color:var(--muted)}
.chart{position:relative}.chart svg{touch-action:pan-y}
.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tk{font-size:10px;fill:var(--muted)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;font-size:12px;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .12s;border-radius:4px}
.tip.on{opacity:1}.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;border:1px solid #fff}
.rw{display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:12px;align-items:center;width:100%;background:none;border:0;padding:6px 4px;text-align:left}
.rw:hover,.rw:focus-visible,.rw.on{background:#f6f6f6;outline:none}
.rw .lb{font-size:13px;line-height:1.25}.rw.on .lb{font-weight:700}
.tr{position:relative;display:block;height:16px}
.z{position:absolute;top:-4px;bottom:-4px;width:1px;background:#bbb}
.bar{position:absolute;top:0;height:100%;background:var(--pos);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.bar.q{background:var(--ink);transform-origin:right}.go .bar{transform:scaleX(1)}.rw.on .bar{background:var(--red)}
.v{position:absolute;top:-1px;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.wb{cursor:pointer;transform-box:fill-box;animation:gy .55s cubic-bezier(.2,.7,.2,1) both}.wb.d{transform-origin:top}.wb.u{transform-origin:bottom}
@keyframes gy{from{transform:scaleY(0)}}
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 22px}
.sc div{border-top:3px solid var(--ink);padding-top:8px}
.sc svg.ic{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.sc div:hover .ic{transform:translateY(-3px) rotate(-4deg)}
.sc b{display:block;font:400 28px/1.15 Georgia,serif;margin-top:4px}.sc span{display:block;font-size:12px;color:var(--muted);line-height:1.4}.sc h3{font-size:14px;margin:4px 0 0}
.src{margin-top:34px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero svg{max-width:300px;margin:0 auto}.sc{grid-template-columns:1fr}.rw{grid-template-columns:minmax(100px,38%) 1fr}}
@media (prefers-reduced-motion:reduce){.nd,.bar,.wb{transition:none!important;animation:none!important}}
</style>
</head>

  var x=SEC[S.sel];
  h+='<div class="card" id="card" role="status"></div>';
  h+='<div class="ctl"><div class="grp">'+pill("sv","rk","Ranking",S.sv==="rk")+pill("sv","wf","Cascada",S.sv==="wf")+"</div>"+(S.sv==="rk"?'<div class="grp"><small>Mostrar</small>'+pill("sm","c","Contribución (pp)",S.sm==="c")+pill("sm","g","Crecimiento anual (%)",S.sm==="g")+"</div>":"")+"</div>";
  h+=S.sv==="rk"?rank():waterfall();
  h+='<p class="note">'+(S.sv==="rk"?"Contribución: cuántos puntos porcentuales aporta cada agrupación a la variación anual del ISE (−0,04 %). Por redondeo, la suma puede no coincidir exactamente.":"Cada barra suma o resta a la anterior hasta llegar a la variación total del ISE: −0,04 puntos porcentuales.")+" Tasas calculadas con la serie original, agosto de 2026 frente a agosto de 2025.</p>";
  return h;
}
function showCard(i){
  var x=SEC[i],c=$("card");if(!c)return;
  c.innerHTML='<div class="n">'+x.n+'</div><b>'+f2(x.c)+' pp</b><b>'+f2(x.g)+' %</b><span><br>Contribución a la variación anual · crecimiento anual. '+x.d+".</span>";
}
function rank(){
  var c=S.sm==="c",mn=c?-0.7:-4.2,mx=c?0.9:5.8,P=v=>(v-mn)/(mx-mn)*100;
  var L=SEC.map((x,i)=>({x:x,i:i,v:c?x.c:x.g})).sort((a,b)=>b.v-a.v);
  return '<div id="plot">'+L.map(o=>'<button class="rw'+(o.i===S.sel?" on":"")+'" data-a="sel" data-v="'+o.i+'"><span class="lb">'+o.x.n+'</span><span class="tr"><i class="z" style="left:'+P(0)+'%"></i><span class="bar'+(o.v<0?" q":"")+'" style="left:'+P(Math.min(0,o.v))+"%;width:"+Math.abs(o.v)/(mx-mn)*100+'%"></span><span class="v" style="left:'+(P(Math.max(0,o.v))+1)+'%">'+f2(o.v)+"</span></span></button>").join("")+"</div>";
}
function waterfall(){
  var T=26,ph=210,mx=0.2,mn=-1.0,ys=v=>T+(mx-v)/(mx-mn)*ph,cum=0,g='<line x1="10" x2="630" y1="'+ys(0)+'" y2="'+ys(0)+'" stroke="#111"/>',n=SEC.length+1,W=620/n;
  SEC.forEach((s,i)=>{
    var a=cum,b=cum+s.c,x=12+i*W+W/2,y1=ys(Math.max(a,b)),y2=ys(Math.min(a,b));cum=b;
    g+='<rect class="wb '+(s.c<0?"d":"u")+'" data-a="sel" data-v="'+i+'" x="'+(x-17)+'" y="'+y1+'" width="34" height="'+Math.max(2,y2-y1)+'" rx="2" fill="'+(i===S.sel?"#d0021b":s.c<0?"#111":"#e58a93")+'" style="animation-delay:'+i*.07+'s"/>'+(i<n-1?'<line x1="'+(x+17)+'" x2="'+(x+W-17)+'" y1="'+ys(b)+'" y2="'+ys(b)+'" stroke="#bbb" stroke-dasharray="3 3"/>':"")+
     '<text class="tk" x="'+x+'" y="'+((s.c<0?y2+13:y1-5))+'" text-anchor="middle" style="fill:#111;font-weight:700">'+f2(s.c)+'</text><text class="tk" x="'+x+'" y="262" text-anchor="middle">'+s.s+"</text>";
  });
  var x=12+(n-1)*W+W/2;
  g+='<rect class="wb u" x="'+(x-17)+'" y="'+ys(0)+'" width="34" height="'+Math.max(3,ys(cum)-ys(0))+'" fill="#d0021b" style="animation-delay:.7s"/><text class="tk" x="'+x+'" y="'+(ys(cum)+14)+'" text-anchor="middle" style="fill:#d0021b;font-weight:700">'+f2(-0.04)+'</text><text class="tk" x="'+x+'" y="262" text-anchor="middle" style="font-weight:700">ISE</text>';
  return '<svg viewBox="0 0 640 275" role="img" aria-label="Cascada de contribuciones al crecimiento anual del ISE">'+g+"</svg>";
}
function render(){
  CH={};
  app.innerHTML='<div class="tabs">'+tab("r","Resumen")+tab("e","Evolución")+tab("s","Sectores")+"</div>"+({r:resumen,e:evol,s:sector})[S.tab]();
  if(S.tab==="r"){needle();cu()}
  if(S.tab==="e"){bindChart();drawIn()}
  if(S.tab==="s"){showCard(S.sel);cu()}
  var p=$("plot");if(p)requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add("go")));
}
app.addEventListener("click",e=>{
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  if(a==="vv"){var n=Object.keys(S.vv).filter(k=>S.vv[k]&&EV[S.em].s.some(s=>s[0]===k)).length;if(S.vv[v]&&n===1)return;S.vv[v]=S.vv[v]?0:1}
  else if(a==="sel")S.sel=+v;
  else S[a]=v;
  render();
});
app.addEventListener("mouseover",e=>{var b=e.target.closest('[data-a="sel"]');if(b)showCard(+b.dataset.v)});
app.addEventListener("mouseleave",()=>{if(S.tab==="s")showCard(S.sel)});
render();
})();
</script>
</body>
</html>
